name: Refresh Profile Telemetry

on:
  schedule:
    # Runs every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "today.py"
      - ".github/workflows/**"
      - "cache/requirements.txt"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "cache/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cache/requirements.txt

      - name: Fetch telemetry and update profile SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER_NAME: bishwajit5788
        run: |
          python today.py

      - name: Validate generated SVGs
        run: |
          python -c "
          import xml.etree.ElementTree as ET
          ET.parse('dark_mode.svg')
          ET.parse('light_mode.svg')
          print('SVG XML verification passed successfully.')
          "

      - name: Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dark_mode.svg light_mode.svg
          if git diff --staged --quiet; then
            echo "No profile telemetry changes to commit."
          else
            git commit -m "chore: refresh profile telemetry [skip ci]"
            git push
          fi
