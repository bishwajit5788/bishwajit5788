<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 600" width="100%" height="100%">
  <defs>
    <!-- Background Technical Grid -->
    <pattern id="techGrid_light" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#1A2517" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="18" cy="18" r="0.8" fill="#1A2517" fill-opacity="0.0600"/>
    </pattern>

    <!-- Subtle Scanline Texture -->
    <pattern id="scanlines_light" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#1A2517" stroke-opacity="0.0240" stroke-width="1"/>
    </pattern>

    <!-- Scanning Beam Gradient -->
    <linearGradient id="scanBeam_light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A2517" stop-opacity="0"/>
      <stop offset="42%" stop-color="#1A2517" stop-opacity="0.02"/>
      <stop offset="49%" stop-color="#1A2517" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#1A2517" stop-opacity="0.36"/>
      <stop offset="51%" stop-color="#1A2517" stop-opacity="0.20"/>
      <stop offset="58%" stop-color="#1A2517" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#1A2517" stop-opacity="0"/>
    </linearGradient>

    <!-- Phosphor Glow Filter for ASCII X-Ray Art -->
    <filter id="asciiGlow_light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="leftPanelClip_light">
      <rect x="32" y="32" width="364" height="536" rx="6"/>
    </clipPath>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono", "SFMono-Regular", Menlo, Consolas, "Roboto Mono", monospace; }
    .ascii { font-family: "JetBrains Mono", Consolas, "SFMono-Regular", Menlo, monospace; font-size: 10.5px; font-weight: 700; white-space: pre; }
    .title { font-size: 20px; font-weight: 700; fill: #1A2517; }
    .headline { font-size: 13.5px; font-weight: 600; fill: #1A2517; letter-spacing: 0.5px; }
    .desc { font-size: 12px; fill: #1A2517; fill-opacity: 0.75; }
    .label { font-size: 12px; font-weight: 600; fill: #700004; }
    .dots { font-size: 12px; fill: #700004; fill-opacity: 0.40; letter-spacing: 1px; }
    .val { font-size: 12px; fill: #1A2517; }
    .val-num { font-size: 13.5px; font-weight: 700; fill: #1A2517; }
    .sec-rule { font-size: 12px; font-weight: 600; fill: #700004; letter-spacing: -0.5px; }
    .meta-tag { font-size: 9.5px; font-weight: 600; fill: #1A2517; fill-opacity: 0.75; letter-spacing: 1px; }
    .status-text { font-size: 10px; font-weight: 700; fill: #700004; letter-spacing: 1.5px; }
    .footer-meta { font-size: 9.5px; fill: #1A2517; fill-opacity: 0.45; letter-spacing: 1px; }
  </style>

  <!-- Canvas Background -->
  <rect width="1060" height="600" fill="#FEFACD"/>
  <rect width="1060" height="600" fill="url(#techGrid_light)"/>
  <rect width="1060" height="600" fill="url(#scanlines_light)"/>

  <!-- Outer Master Chassis Frame -->
  <rect x="16" y="16" width="1028" height="568" rx="8" fill="none" stroke="#700004" stroke-width="1.5" stroke-opacity="0.55"/>

  <!-- Outer Corner Reinforcement Brackets -->
  <path d="M 16 36 L 16 16 L 36 16" fill="none" stroke="#700004" stroke-width="3"/>
  <path d="M 1024 16 L 1044 16 L 1044 36" fill="none" stroke="#700004" stroke-width="3"/>
  <path d="M 16 564 L 16 584 L 36 584" fill="none" stroke="#700004" stroke-width="3"/>
  <path d="M 1024 584 L 1044 584 L 1044 564" fill="none" stroke="#700004" stroke-width="3"/>

  <!-- Top Frame Coordinates & Status -->
  <text x="42" y="28" class="mono meta-tag">CONSOLE // RED-TEAM RECON STATION</text>
  <text x="1018" y="28" text-anchor="end" class="mono meta-tag">NODE_01 // SECURE CH: 0x7F</text>

  <!-- ============================================================ -->
  <!-- LEFT PANEL: X-RAY / RECON VISUAL (364px wide: x=32 to 396) -->
  <!-- ============================================================ -->
  <g id="left_panel">
    <!-- Panel Housing -->
    <rect x="32" y="32" width="364" height="536" rx="6" fill="#FEFACD" stroke="#700004" stroke-width="1.2" stroke-opacity="0.55"/>

    <!-- Left Panel Header -->
    <rect x="42" y="42" width="168" height="22" rx="3" fill="#700004" fill-opacity="0.18" stroke="#700004" stroke-width="1"/>
    <text x="48" y="57" class="mono" font-size="10px" font-weight="700" fill="#700004" letter-spacing="1px">THREAT SURFACE // X-RAY</text>

    <rect x="316" y="42" width="70" height="22" rx="3" fill="#700004" fill-opacity="0.18" stroke="#700004" stroke-width="1"/>
    <text x="351" y="57" text-anchor="middle" class="mono" font-size="10px" font-weight="700" fill="#1A2517">NODE_01</text>

    <!-- Sub-header Telemetry -->
    <text x="44" y="78" class="mono meta-tag">LAT 28.6139° N / LON 77.2090° E</text>
    <text x="384" y="78" text-anchor="end" class="mono meta-tag">FREQ: 2.4/5.8 GHz</text>

    <!-- Left Panel Internal Scope Frame -->
    <rect x="42" y="86" width="344" height="428" rx="4" fill="none" stroke="#700004" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="4 4"/>

    <!-- Reticle Corner Ticks -->
    <path d="M 48 98 L 48 92 L 54 92" fill="none" stroke="#700004" stroke-width="1.5"/>
    <path d="M 380 98 L 380 92 L 374 92" fill="none" stroke="#700004" stroke-width="1.5"/>
    <path d="M 48 502 L 48 508 L 54 508" fill="none" stroke="#700004" stroke-width="1.5"/>
    <path d="M 380 502 L 380 508 L 374 508" fill="none" stroke="#700004" stroke-width="1.5"/>

    <!-- ============================================== -->
    <!-- X-RAY / HARDWARE RECON EMBLEM (ASCII Matrix)   -->
    <!-- ============================================== -->
    <!-- Targeting Crosshairs and Radar Rings Behind ASCII -->
    <circle cx="214" cy="295" r="152" fill="none" stroke="#700004" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="2 6"/>
    <circle cx="214" cy="295" r="108" fill="none" stroke="#1A2517" stroke-width="0.7" stroke-opacity="0.12"/>
    <circle cx="214" cy="295" r="68" fill="none" stroke="#700004" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 4"/>

    <line x1="56" y1="295" x2="372" y2="295" stroke="#700004" stroke-width="0.7" stroke-opacity="0.35" stroke-dasharray="4 4"/>
    <line x1="214" y1="102" x2="214" y2="488" stroke="#700004" stroke-width="0.7" stroke-opacity="0.35" stroke-dasharray="4 4"/>

    <!-- ASCII X-Ray Cyber Reconstruction Rendered from Reference Image -->
    <g id="xray_ascii_emblem" filter="url(#asciiGlow_light)">
      <text x="54" y="120" class="ascii" xml:space="preserve" fill="#700004">
      <tspan x="54" y="120.0">                      ..                      </tspan>
      <tspan x="54" y="131.2">                     :--:                     </tspan>
      <tspan x="54" y="142.4">                    -=--+-.                   </tspan>
      <tspan x="54" y="153.6">                  :-:=-=+:=:                  </tspan>
      <tspan x="54" y="164.8">                .----:==:=-=-.                </tspan>
      <tspan x="54" y="176.0">               :-:=-:**++:-+:-:               </tspan>
      <tspan x="54" y="187.2">             .=--+:=#==+-*=:+--=.             </tspan>
      <tspan x="54" y="198.4">            --=+=.-@==#=:-#- =+=-:            </tspan>
      <tspan x="54" y="209.6">        .--=:-=: .*++#===:+#  :=-:=--         </tspan>
      <tspan x="54" y="220.8">        :--==- ..:*+#::::+=*-   -++-=:        </tspan>
      <tspan x="54" y="232.0">        .-=+..=: ==*-:-:.:=++ .- .+==.        </tspan>
      <tspan x="54" y="243.2">         -+: . ..*++*+--==:+*.. . :+-         </tspan>
      <tspan x="54" y="254.4">         :=-: .:=*==++====.-#=:. .:=-         </tspan>
      <tspan x="54" y="265.6">         :=:=:-.*==+..--.:=:=*.-:::=:         </tspan>
      <tspan x="54" y="276.8">         -+-----*.=*::+=:-*:.*-----+-         </tspan>
      <tspan x="54" y="288.0">         :=: +.-*:-:**+-*+-..+-.+ -=-         </tspan>
      <tspan x="54" y="299.2">         -+-:::.*=:-+*--*=-.-+.:::-+-         </tspan>
      <tspan x="54" y="310.4">         :==: ..+#::=+-:+=-.+= . :==-         </tspan>
      <tspan x="54" y="321.6">         :=:  .*=#= .*==*..-*=*.  :=-         </tspan>
      <tspan x="54" y="332.8">         :=: -##--*. :+=. .=--#*- :=-         </tspan>
      <tspan x="54" y="344.0">         -+-*%=+#:=-. ...::- +++%+-+=         </tspan>
      <tspan x="54" y="355.2">        .-=+-=+**=.-.-..-.:.-+-==-+-=:        </tspan>
      <tspan x="54" y="366.4">        :--+=:+*:+-..=--= .-=.=-:+*-=:        </tspan>
      <tspan x="54" y="377.6">         :-=-+--:.- -=-==- :..==+---:         </tspan>
      <tspan x="54" y="388.8">           .-==+-. .. =+ :. .=+==-.           </tspan>
      <tspan x="54" y="400.0">             -=+*+:  :==:. :++=-:             </tspan>
      <tspan x="54" y="411.2">              .=-=+:......:+---.              </tspan>
      <tspan x="54" y="422.4">                :=-==:--:+-:-:                </tspan>
      <tspan x="54" y="433.6">                  ---*=-+:-:                  </tspan>
      <tspan x="54" y="444.8">                   .-+=-=-.                   </tspan>
      <tspan x="54" y="456.0">                     --=:                     </tspan>
      <tspan x="54" y="467.2">                      ..                      </tspan>
      </text>
    </g>

    <!-- Scanning Beam Animation (Subtle, Slow, Professional) -->
    <g clip-path="url(#leftPanelClip_light)">
      <rect x="32" y="86" width="364" height="60" fill="url(#scanBeam_light)">
        <animate attributeName="y" values="70;460;70" dur="6.5s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Left Panel Footer / Telemetry Status -->
    <line x1="42" y1="520" x2="386" y2="520" stroke="#700004" stroke-width="1" stroke-opacity="0.4"/>
    <text x="44" y="536" class="mono meta-tag">THREAT SIGNATURE // VISUAL MAP</text>

    <!-- Pulsing Scan Active Beacon -->
    <circle cx="50" cy="552" r="4.5" fill="#700004">
      <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="62" y="556" class="mono status-text">SCAN ACTIVE</text>

    <!-- RF Waveform / Telemetry Signal Bars -->
    <g transform="translate(322, 544)" fill="#700004" opacity="0.8">
      <rect x="0" y="8" width="3" height="4" rx="1"/>
      <rect x="5" y="5" width="3" height="7" rx="1"/>
      <rect x="10" y="2" width="3" height="10" rx="1"/>
      <rect x="15" y="0" width="3" height="12" rx="1"/>
      <rect x="20" y="4" width="3" height="8" rx="1"/>
      <rect x="25" y="7" width="3" height="5" rx="1"/>
      <rect x="30" y="3" width="3" height="9" rx="1"/>
      <rect x="35" y="1" width="3" height="11" rx="1"/>
      <rect x="40" y="6" width="3" height="6" rx="1"/>
      <rect x="45" y="9" width="3" height="3" rx="1"/>
    </g>
  </g>

  <!-- ============================================================ -->
  <!-- RIGHT PANEL: PROFILE INFORMATION (x=416 to 1028)             -->
  <!-- ============================================================ -->
  <g id="right_panel" class="mono">
    <!-- Panel Housing -->
    <rect x="416" y="32" width="612" height="536" rx="6" fill="#FEFACD" stroke="#700004" stroke-width="1.2" stroke-opacity="0.55"/>

    <!-- Technical Framing Corner Brackets -->
    <path d="M 426 48 L 426 40 L 434 40" fill="none" stroke="#700004" stroke-width="2.5"/>
    <path d="M 1018 48 L 1018 40 L 1010 40" fill="none" stroke="#700004" stroke-width="2.5"/>
    <path d="M 426 552 L 426 560 L 434 560" fill="none" stroke="#700004" stroke-width="2.5"/>
    <path d="M 1018 552 L 1018 560 L 1010 560" fill="none" stroke="#700004" stroke-width="2.5"/>

    <!-- 1. Identity Line -->
    <g transform="translate(436, 66)">
      <text x="0" y="0" class="label" font-size="16px">$ whoami</text>
      <text x="82" y="0" fill="#700004" font-size="16px">→</text>
      <text x="104" y="0" class="title">Bishwajit Das</text>
      <line x1="262" y1="-6" x2="572" y2="-6" stroke="#700004" stroke-width="1.2" stroke-opacity="0.5"/>
    </g>

    <!-- 2. Primary Title / Headline -->
    <text x="436" y="96" class="headline">Cybersecurity • Embedded Systems • Red Team Research</text>

    <!-- 3. Supporting Description -->
    <text x="436" y="118" class="desc">Building hardware/software security projects, embedded systems,</text>
    <text x="436" y="136" class="desc">wireless research tools, and isolated security research sandboxes.</text>

    <!-- Section Separator Line -->
    <line x1="436" y1="152" x2="1008" y2="152" stroke="#700004" stroke-width="1" stroke-opacity="0.3"/>

    <!-- 4. Technical Build Matrix -->
    <!-- Row: Builds -->
    <g transform="translate(436, 175)">
      <text x="0" y="0" class="label">Builds:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">SliverOS, PondEyes, EchoNode</text>
    </g>
    <g transform="translate(436, 195)">
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">Red-Team-Packet-Sniffer, OSINT Threat Mapper</text>
    </g>

    <!-- Row: Radios -->
    <g transform="translate(436, 217)">
      <text x="0" y="0" class="label">Radios:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">Wi-Fi, BLE, Sub-GHz</text>
    </g>

    <!-- Row: Tools -->
    <g transform="translate(436, 239)">
      <text x="0" y="0" class="label">Tools:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">ESP-IDF, Arduino IDE, PlatformIO, Blender, VS Code</text>
    </g>

    <!-- Row: Languages -->
    <g transform="translate(436, 261)">
      <text x="0" y="0" class="label">Languages:</text>
      <text x="95" y="0" class="dots">................</text>
      <text id="lang_data" x="180" y="0" class="val">Python, C++, C, TypeScript, JavaScript</text>
    </g>

    <!-- 5. Contact Section -->
    <g transform="translate(436, 287)">
      <text x="0" y="0" class="sec-rule">─ Contact ─────────────────────────────────────────────────────────</text>
    </g>

    <g transform="translate(436, 311)">
      <text x="0" y="0" class="label">Email:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">dbishwajit305@gmail.com</text>
    </g>
    <g transform="translate(436, 331)">
      <text x="0" y="0" class="label">Instagram:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">@bishwajit5788</text>
    </g>
    <g transform="translate(436, 351)">
      <text x="0" y="0" class="label">GitHub:</text>
      <text x="95" y="0" class="dots">................</text>
      <text x="180" y="0" class="val">bishwajit5788</text>
    </g>

    <!-- 6. Live GitHub Telemetry -->
    <g transform="translate(436, 377)">
      <text x="0" y="0" class="sec-rule">─ Live GitHub Telemetry ───────────────────────────────────────────</text>
    </g>

    <!-- Stats Grid: 2 Columns with Leader Dots -->
    <g transform="translate(436, 401)">
      <!-- Left Column: Repos -->
      <text x="0" y="0" class="label">Repos:</text>
      <text x="65" y="0" class="dots">........</text>
      <text id="repo_data" x="140" y="0" class="val-num">13</text>

      <!-- Right Column: Stars -->
      <text x="280" y="0" class="label">| Stars:</text>
      <text x="375" y="0" class="dots">........</text>
      <text id="star_data" x="450" y="0" class="val-num">0</text>
    </g>

    <g transform="translate(436, 423)">
      <!-- Left Column: Commits -->
      <text x="0" y="0" class="label">Commits:</text>
      <text x="65" y="0" class="dots">........</text>
      <text id="commit_data" x="140" y="0" class="val-num">95+</text>

      <!-- Right Column: Followers -->
      <text x="280" y="0" class="label">| Followers:</text>
      <text x="375" y="0" class="dots">........</text>
      <text id="follower_data" x="450" y="0" class="val-num">0</text>
    </g>

    <!-- 7. Recent Repositories Matrix -->
    <g transform="translate(436, 449)">
      <text x="0" y="0" class="sec-rule">─ Recent Repositories ─────────────────────────────────────────────</text>
    </g>

    <g transform="translate(436, 473)">
      <text x="0" y="0" class="label">01:</text>
      <text id="recent_1" x="32" y="0" class="val">PondEyes-Omni-Lighthouse</text>

      <text x="280" y="0" class="label">| 02:</text>
      <text id="recent_2" x="325" y="0" class="val">SliverOS</text>
    </g>

    <g transform="translate(436, 497)">
      <text x="0" y="0" class="label">03:</text>
      <text id="recent_3" x="32" y="0" class="val">EchoNode0.1</text>

      <text x="280" y="0" class="label">| 04:</text>
      <text id="recent_4" x="325" y="0" class="val">Rpoper</text>
    </g>

    <!-- System Footer Metadata -->
    <line x1="436" y1="518" x2="1008" y2="518" stroke="#700004" stroke-width="1" stroke-opacity="0.3"/>
    <text x="436" y="538" class="footer-meta">ARCH: EMBEDDED-X86 // RADIO: MULTI-BAND // AUTH: VERIFIED SECURE</text>
    <text x="1008" y="538" text-anchor="end" class="footer-meta">STATUS: OPERATIONAL</text>
  </g>
</svg>